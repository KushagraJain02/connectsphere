apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: connectsphere
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'auth-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['auth-service:8081']

      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['user-service:8082']

      - job_name: 'post-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['post-service:8083']

      - job_name: 'connection-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['connection-service:8084']

      - job_name: 'messaging-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['messaging-service:8085']

      - job_name: 'notification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['notification-service:8086']

      - job_name: 'job-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['job-service:8087']

      - job_name: 'api-gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['api-gateway:8080']

      - job_name: 'eureka-server'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['eureka-server:8761']

      - job_name: 'config-server'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['config-server:8888']

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - connectsphere
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true