apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: connectsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: connectsphere/config-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: connectsphere-config
                  key: EUREKA_URL
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: connectsphere-config
                  key: HIKARI_MAX_POOL_SIZE
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              valueFrom:
                configMapKeyRef:
                  name: connectsphere-config
                  key: HIKARI_MIN_IDLE
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: connectsphere
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888