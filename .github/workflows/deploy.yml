name: Deploy — Build and Push

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: eureka-server
            context: ./eureka-server
            port: 8761
          - name: config-server
            context: ./config-server
            port: 8888
          - name: api-gateway
            context: ./api-gateway
            port: 8080
          - name: auth-service
            context: ./auth-service
            port: 8081
          - name: user-service
            context: ./user-service
            port: 8082
          - name: post-service
            context: ./post-service
            port: 8083
          - name: connection-service
            context: ./connection-service
            port: 8084
          - name: messaging-service
            context: ./messaging-service
            port: 8085
          - name: notification-service
            context: ./notification-service
            port: 8086
          - name: job-service
            context: ./job-service
            port: 8087

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: ${{ matrix.service.context }}
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: ${{ matrix.service.context }}
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-${{ matrix.service.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-success:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ build-and-push, build-frontend ]
    if: success()
    steps:
      - name: Success summary
        run: |
          echo "✅ All images built and pushed!"
          echo "🏷️  Tag: ${{ github.sha }}"
          echo "🐳 https://hub.docker.com/u/${{ secrets.DOCKER_USERNAME }}"