name: Deploy — Build and Push

on:
  push:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ── Build and push all service images ─────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: eureka-server
            context: ./eureka-server
          - name: config-server
            context: ./config-server
          - name: api-gateway
            context: ./api-gateway
          - name: auth-service
            context: ./auth-service
          - name: user-service
            context: ./user-service
          - name: post-service
            context: ./post-service
          - name: connection-service
            context: ./connection-service
          - name: messaging-service
            context: ./messaging-service
          - name: notification-service
            context: ./notification-service
          - name: job-service
            context: ./job-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: ${{ matrix.service.context }}
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-${{ matrix.service.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build and push frontend ────────────────────────────────
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/connectsphere-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Update K8s image tags ──────────────────────────────────
  update-k8s-images:
    name: Update K8s Image Tags
    runs-on: ubuntu-latest
    needs: [ build-and-push, build-frontend ]
    steps:
      - uses: actions/checkout@v4

      - name: Update image tags in K8s manifests
        run: |
          SERVICES=(eureka-server config-server api-gateway auth-service user-service post-service connection-service messaging-service notification-service job-service frontend)
          for SERVICE in "${SERVICES[@]}"; do
            sed -i "s|image: .*/connectsphere-${SERVICE}:.*|image: ${{ secrets.DOCKER_USERNAME }}/connectsphere-${SERVICE}:${{ github.sha }}|g" k8s/services/${SERVICE}.yaml 2>/dev/null || true
            sed -i "s|image: .*/connectsphere-${SERVICE}:.*|image: ${{ secrets.DOCKER_USERNAME }}/connectsphere-${SERVICE}:${{ github.sha }}|g" k8s/frontend/${SERVICE}.yaml 2>/dev/null || true
          done

      - name: Commit updated manifests
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

  # ── Summary ────────────────────────────────────────────────
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [ build-and-push, build-frontend ]
    if: success()
    steps:
      - name: Success summary
        run: |
          echo "✅ All images built and pushed successfully!"
          echo "📦 Images pushed with tag: ${{ github.sha }}"
          echo "🐳 Docker Hub: https://hub.docker.com/u/${{ secrets.DOCKER_USERNAME }}"