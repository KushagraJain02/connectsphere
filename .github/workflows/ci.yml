test-auth-service:
  name: Test Auth Service
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Make mvnw executable
      working-directory: auth-service
      run: chmod +x mvnw
    - name: Run Tests
      working-directory: auth-service
      run: ./mvnw test -Dtest="AuthServiceTest,JwtServiceTest,AuthControllerTest" -Dsurefire.failIfNoSpecifiedTests=false
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

  test-job-service:
    name: Test Job Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        working-directory: job-service
        run: chmod +x mvnw
      - name: Run Tests
        working-directory: job-service
        run: ./mvnw test -Dtest="JobServiceTest" -Dsurefire.failIfNoSpecifiedTests=false