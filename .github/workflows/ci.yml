name: CI — Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        working-directory: auth-service
        run: chmod +x mvnw
      - name: Run Tests
        working-directory: auth-service
        run: ./mvnw test -Dtest="AuthServiceTest,JwtServiceTest" -Dsurefire.failIfNoSpecifiedTests=false
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  test-post-service:
    name: Test Post Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        working-directory: post-service
        run: chmod +x mvnw
      - name: Run Tests
        working-directory: post-service
        run: ./mvnw test -Dtest="PostServiceTest" -Dsurefire.failIfNoSpecifiedTests=false

  test-job-service:
    name: Test Job Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        working-directory: job-service
        run: chmod +x mvnw
      - name: Run Tests
        working-directory: job-service
        run: ./mvnw test -Dtest="JobServiceTest" -Dsurefire.failIfNoSpecifiedTests=false

  test-connection-service:
    name: Test Connection Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        working-directory: connection-service
        run: chmod +x mvnw
      - name: Run Tests
        working-directory: connection-service
        run: ./mvnw test -Dtest="ConnectionServiceTest" -Dsurefire.failIfNoSpecifiedTests=false

  test-frontend:
    name: Test Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build